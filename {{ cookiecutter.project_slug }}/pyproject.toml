[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_description }}"
authors = [
    {% if cookiecutter.co_authors -%}
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
    {%- for author in cookiecutter.co_authors.split(',') %}
    { name = "{{ author.strip() }}" },
    {%- endfor %}
    {%- else -%}
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }
    {%- endif %}
]
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
license = { text = "MIT" }

dependencies = [
    # Jupyter Book core
    "jupyter-book>=0.15.0",

    # Data science stack
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",

    # Sphinx extensions
    "sphinx-proof>=0.1.3",
    "sphinx-examples>=0.0.5",
    "sphinxcontrib-bibtex>=2.5.0",

    # Interactive notebooks
    "ipywidgets>=8.0.0",
    "plotly>=5.0.0",

    # PDF generation
    "pyppeteer>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 88
target-version = ["py{{ cookiecutter.python_version.replace('.', '') }}"]

[tool.ruff]
line-length = 88
target-version = "py{{ cookiecutter.python_version.replace('.', '') }}"
