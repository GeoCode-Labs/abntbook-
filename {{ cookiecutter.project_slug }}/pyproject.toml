[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_description }}"
authors = [
    {% if cookiecutter.co_authors -%}
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
    {%- for author in cookiecutter.co_authors.split(',') %}
    { name = "{{ author.strip() }}" },
    {%- endfor %}
    {%- else -%}
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }
    {%- endif %}
]
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
license = { text = "MIT" }


dependencies = [
    # Jupyter Book core
    "jupyter-book>=2.0.0",

    # Data science stack
    "matplotlib>=3.10.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",

    # Sphinx extensions
    "sphinx-proof>=0.3.0",
    "sphinx-examples>=0.0.5",
    "sphinxcontrib-bibtex>=2.6.5",

    # Interactive notebooks
    "ipywidgets>=8.1.8",
    "plotly>=6.4.0",

    # PDF generation
    "pyppeteer>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "black>=25.11.0",
    "ruff>=0.14.0",
]