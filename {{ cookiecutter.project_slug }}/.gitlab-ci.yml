image: python:{{ cookiecutter.python_version }}

stages:
  - build
  - deploy

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/uv
    - .venv/

before_script:
  # Instalar Node.js (requerido pelo Jupyter Book)
  - apt-get update && apt-get install -y curl
  - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
  - apt-get install -y nodejs
  - node --version
  - npm --version
  # Instalar uv (gerenciador de pacotes Python ultrarrápido)
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - export PATH="$HOME/.cargo/bin:$PATH"
  - uv --version
  # Configurar ambiente Python com uv
  - python -V
  - uv venv
  - source .venv/bin/activate
  - uv pip install -r requirements.txt

# Build do Jupyter Book
build:
  stage: build
  script:
    - jupyter-book clean .
    - jupyter-book build --all .
  artifacts:
    paths:
      - _build/html
    expire_in: 1 week
  only:
    - main
    - master
    - develop

# Deploy para GitLab Pages
pages:
  stage: deploy
  script:
    - jupyter-book clean .
    - jupyter-book build --all .
    - mv _build/html public
  artifacts:
    paths:
      - public
  only:
    - main
    - master
